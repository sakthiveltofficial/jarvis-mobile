plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.jarvis.bridge'
version = '0.1.0'

android {
  namespace "dev.jarvis.bridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
  // Shizuku (Apache-2.0): optional adb-level "power mode" without root.
  implementation "dev.rikka.shizuku:api:13.1.5"
  implementation "dev.rikka.shizuku:provider:13.1.5"
  // ARCore (Google Play Services for AR) for the AR tab. "optional" in the manifest: phones without it still install.
  implementation "com.google.ar:core:1.47.0"
}
